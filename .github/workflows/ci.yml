name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: 1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Check preview and production website output
        run: |
          for environment in production preview; do
            export VERCEL_ENV="$environment"
            pnpm --filter @clearedin/website build
            pnpm site:check
          done
      - run: pnpm docs:check
      # Integration builds the site, and each packaging command builds its browser target.
      - run: pnpm package:chrome
      - run: pnpm package:firefox
      - run: pnpm artifacts:check
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - run: pnpm release:amo
      - uses: actions/upload-artifact@v4
        with:
          name: development-review-bundle
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
      # Signed store delivery and human acceptance are separate release gates.
      # No deployment, signing, provider secrets, or publishing in this workflow.
  desktop-upgrades:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: development-review-bundle
          path: apps/extension/.output
      - name: Extract the packaged Firefox manifest for the upgrade driver
        run: |
          $archive = Get-Item apps/extension/.output/*-firefox.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath apps/extension/.output/firefox-mv3
      - run: node experiments/browser-feasibility/browser-runner.mjs chrome --upgrade
      - run: node experiments/browser-feasibility/browser-runner.mjs firefox --upgrade
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-upgrade-evidence
          path: experiments/browser-feasibility/results/*-upgrade.json
          if-no-files-found: error
