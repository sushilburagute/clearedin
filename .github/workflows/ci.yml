name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: 1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm site:check
      - run: pnpm docs:check
      # Integration builds the site, and each packaging command builds its browser target.
      - run: pnpm package:chrome
      - run: pnpm package:firefox
      - run: pnpm artifacts:check
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - run: pnpm release:amo
      - uses: actions/upload-artifact@v4
        with:
          name: development-review-bundle
          path: .release/
      # Local integration is synthetic; packaged-browser/manual release gates remain separate.
      # No deployment, signing, provider secrets, or publishing in this workflow.
